<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Clipboard / Survey Sheet -->
  <g filter="url(#shadow)">
    <!-- Clipboard Board -->
    <rect x="116" y="96" width="280" height="340" rx="24" fill="#ffffff" />
    <!-- Clipboard Clip -->
    <rect x="206" y="76" width="100" height="36" rx="10" fill="#93c5fd" stroke="#ffffff" stroke-width="4" />
    <circle cx="256" cy="94" r="8" fill="#1e40af" />
    
    <!-- Survey Rows / Checklist -->
    <!-- Row 1: Checked -->
    <rect x="156" y="156" width="32" height="32" rx="8" fill="#10b981" />
    <path d="M164 172 L170 178 L180 166" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="204" y="164" width="152" height="16" rx="8" fill="#e2e8f0" />
    
    <!-- Row 2: Checked -->
    <rect x="156" y="212" width="32" height="32" rx="8" fill="#10b981" />
    <path d="M164 228 L170 234 L180 222" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="204" y="220" width="128" height="16" rx="8" fill="#e2e8f0" />
    
    <!-- Row 3: Progress/Empty Checkbox -->
    <rect x="156" y="268" width="32" height="32" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3" />
    <rect x="204" y="276" width="144" height="16" rx="8" fill="#e2e8f0" />
    
    <!-- Row 4: Star Rating -->
    <g transform="translate(156, 324) scale(0.9)">
      <!-- Star 1 -->
      <polygon points="14,1 18,10 27,11 20,18 22,27 14,22 6,27 8,18 1,11 10,10" fill="#f59e0b" />
      <!-- Star 2 -->
      <polygon points="44,1 48,10 57,11 50,18 52,27 44,22 36,27 38,18 31,11 40,10" fill="#f59e0b" />
      <!-- Star 3 -->
      <polygon points="74,1 78,10 87,11 80,18 82,27 74,22 66,27 68,18 61,11 70,10" fill="#f59e0b" />
      <!-- Star 4 -->
      <polygon points="104,1 108,10 117,11 110,18 112,27 104,22 96,27 98,18 91,11 100,10" fill="#f59e0b" />
      <!-- Star 5 -->
      <polygon points="134,1 138,10 147,11 140,18 142,27 134,22 126,27 128,18 121,11 130,10" fill="#cbd5e1" />
    </g>
    
    <!-- Pulse / Signal wifi icon in the corner indicating online/offline sync -->
    <g transform="translate(320, 350)">
      <circle cx="28" cy="28" r="24" fill="#0284c7" />
      <path d="M18 22 A14 14 0 0 1 38 22" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M22 26 A8 8 0 0 1 34 26" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
      <circle cx="28" cy="31" r="2.5" fill="#ffffff" />
    </g>
  </g>
</svg>
